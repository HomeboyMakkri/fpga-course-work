<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="1400" viewBox="0 0 2300 1400">
<rect width="2200" height="1400" fill="#fff"/><style>text{font-family:"Segoe UI",Arial,sans-serif;fill:#111;font-size:22px}.title{font-size:34px;font-weight:700}.subtitle{font-size:20px;fill:#444}.bt{font-size:25px;font-weight:700}.small{font-size:17px;fill:#333}.net{font-size:18px;font-weight:700;fill:#075aa8}.ref{font-size:18px;font-weight:700}.wire{stroke:#111;stroke-width:3;fill:none;stroke-linecap:square;stroke-linejoin:miter}.power{stroke:#b71c1c;stroke-width:3;fill:none}.box{fill:#fff;stroke:#111;stroke-width:3}.module{fill:#eef6ff;stroke:#1565c0;stroke-width:4}.external{fill:#f6f6f6;stroke:#666;stroke-width:2.5}.note{fill:#fff8e1;stroke:#b28704;stroke-width:2}.node{fill:#111}.tp{fill:#fff;stroke:#111;stroke-width:3}.pin{font-size:17px;font-weight:700;fill:#555}.bom{font-size:18px}</style>
<defs><g id="gnd"><path d="M0 0v14M-20 14h40M-13 23h26M-6 32h12" class="wire"/></g><g id="rh"><rect x="0" y="-18" width="100" height="36" class="box"/></g><g id="rv"><rect x="-18" y="0" width="36" height="88" class="box"/></g><g id="cv"><path d="M-9 -28v56M9 -28v56" class="wire"/></g><g id="ch"><path d="M-28 -9h56M-28 9h56" class="wire"/></g><g id="tp"><circle r="10" class="tp"/><circle r="3.5" class="node"/></g></defs>
<text x="45" y="52" class="title">Прототип формирователя 1 / 10 / 100 PPS на Tang Nano 20K</text><text x="45" y="84" class="subtitle">Вход: синус 10 МГц от ГК199-ТС · два независимых выхода · управление штатными кнопками платы</text>

<!-- 1 source -->
<text x="45" y="130" class="bt">1. Источник опорного сигнала</text><rect x="45" y="155" width="330" height="235" rx="8" class="external"/>
<text x="70" y="190" class="bt">XG1 — ГК199-ТС</text><text x="70" y="230">Выход SIN: 10 МГц</text><text x="70" y="264">Амплитуда: &gt; 300 мВ</text><text x="70" y="298">Нагрузка: 50 Ω ±5%</text><text x="70" y="344" class="small">Центральная жила → J1.1</text><text x="70" y="372" class="small">Экран → общая земля</text><circle cx="375" cy="230" r="6" class="node"/><circle cx="375" cy="340" r="6" class="node"/>
<rect x="45" y="425" width="330" height="120" rx="8" class="external"/><text x="70" y="463" class="bt">PS1 — питание XG1</text><text x="70" y="499">5 В или 12 В*</text><text x="70" y="528" class="small">*по исполнению генератора</text>

<!-- 2 input -->
<text x="430" y="130" class="bt">2. Вход и согласование</text><rect x="430" y="155" width="650" height="390" rx="8" class="box"/>
<text x="462" y="190" class="ref">J1 — вход коаксиала</text><circle cx="485" cy="260" r="22" class="box"/><circle cx="485" cy="260" r="5" class="node"/><path d="M463 292h44M470 302h30" class="wire"/><text x="448" y="338" class="small">1 — центр</text><text x="448" y="363" class="small">2 — экран</text>
<path d="M375 230H485M375 340H485V302M485 260H585" class="wire"/><circle cx="560" cy="260" r="5" class="node"/><use href="#tp" x="560" y="222"/><path d="M560 232V260" class="wire"/><text x="535" y="202" class="ref">TP1</text><text x="520" y="289" class="net">RF_IN</text>
<path d="M585 260V325" class="wire"/><use href="#rv" x="585" y="325"/><path d="M585 413V445" class="wire"/><use href="#gnd" x="585" y="445"/><text x="610" y="354" class="ref">R1</text><text x="610" y="382">49.9 Ω, 1%</text><text x="610" y="411" class="small">терминация 50 Ω</text>
<path d="M585 260H660M660 260H672M728 260H760" class="wire"/><use href="#cv" x="700" y="260"/><text x="665" y="217" class="ref">C1</text><text x="655" y="315">100 нФ</text><text x="647" y="343" class="small">AC-развязка</text>
<use href="#rh" x="760" y="260"/><path d="M860 260H965" class="wire"/><text x="787" y="223" class="ref">R2</text><text x="786" y="300">1 кΩ</text><circle cx="920" cy="260" r="5" class="node"/><text x="886" y="238" class="net">VIN_BIAS</text>
<path d="M920 260V350" class="wire"/><use href="#rv" x="920" y="350"/><path d="M920 438V478H1015" class="wire"/><text x="944" y="377" class="ref">R3</text><text x="944" y="408">10 кΩ</text><text x="944" y="469" class="net">VREF = 1.65 В</text>

<!-- 3 comparator -->
<text x="1125" y="130" class="bt">3. Формирователь уровня</text><rect x="1125" y="155" width="540" height="750" rx="8" class="box"/><text x="1160" y="194" class="bt">U1 — TLV3511DBVR</text><text x="1160" y="224" class="small">быстродействующий компаратор, push-pull, 3.3 В</text>
<path d="M1280 290V470L1500 380Z" class="box"/><text x="1315" y="348" class="bt">+</text><text x="1315" y="433" class="bt">−</text><text x="1243" y="342" class="pin">3</text><text x="1243" y="432" class="pin">4</text><text x="1508" y="372" class="pin">1</text><text x="1392" y="286" class="pin">5</text><text x="1392" y="492" class="pin">2</text>
<path d="M965 260H1175V335H1280M1015 478H1175V425H1280" class="wire"/><circle cx="1015" cy="478" r="5" class="node"/><use href="#tp" x="1060" y="478"/><text x="1035" y="520" class="ref">TP2</text>
<path d="M1400 260V290M1370 260H1430" class="power"/><text x="1439" y="267" class="net">+3V3</text><path d="M1400 470V510" class="wire"/><use href="#gnd" x="1400" y="510"/>
<path d="M1500 380H1535" class="wire"/><use href="#rh" x="1535" y="380"/><path d="M1635 380H1725" class="wire"/><text x="1565" y="343" class="ref">R6</text><text x="1562" y="421">33 Ω</text><use href="#tp" x="1680" y="342"/><path d="M1680 352V380" class="wire"/><text x="1654" y="322" class="ref">TP3</text><text x="1650" y="413" class="net">REF_CLK</text>

<!-- vref divider -->
<text x="1160" y="582" class="ref">Опорное напряжение VREF</text><path d="M1200 610H1260" class="power"/><text x="1160" y="618" class="net">+3V3</text><use href="#rv" x="1260" y="610"/><path d="M1260 698V715" class="wire"/><text x="1285" y="640" class="ref">R4</text><text x="1285" y="672">10 кΩ</text><circle cx="1260" cy="715" r="5" class="node"/><text x="1290" y="721" class="net">VREF</text><path d="M1260 715V760" class="wire"/><use href="#rv" x="1260" y="760"/><path d="M1260 848V870" class="wire"/><use href="#gnd" x="1260" y="870"/><text x="1285" y="790" class="ref">R5</text><text x="1285" y="822">10 кΩ</text><path d="M1260 715H1450M1450 715V732M1450 788V825" class="wire"/><use href="#ch" x="1450" y="760"/><use href="#gnd" x="1450" y="825"/><text x="1485" y="752" class="ref">C2</text><text x="1485" y="783">1 мкФ</text>

<!-- local bypass -->
<rect x="1125" y="915" width="540" height="200" rx="8" class="note"/><text x="1155" y="952" class="bt">Развязка питания U1</text><text x="1155" y="987" class="small">C3 поставить максимально близко к выводам 5 и 2.</text><path d="M1200 1025H1530" class="power"/><text x="1155" y="1033" class="net">+3V3</text><path d="M1300 1025V1055M1470 1025V1055" class="wire"/><use href="#ch" x="1300" y="1083"/><use href="#ch" x="1470" y="1083"/><path d="M1300 1111V1125M1470 1111V1125" class="wire"/><text x="1190" y="1089" class="ref">C3 100 нФ</text><text x="1505" y="1089" class="ref">C4 1 мкФ</text>

<!-- 4 tang module -->
<text x="1725" y="130" class="bt">4. Готовый модуль FPGA</text><rect x="1725" y="155" width="430" height="665" rx="12" class="module"/><text x="1760" y="198" class="bt">U2 — Tang Nano 20K</text><text x="1760" y="231">FPGA Gowin GW2AR-18</text><rect x="1780" y="270" width="310" height="70" rx="6" class="external"/><text x="1810" y="300" class="ref">USB-C</text><text x="1810" y="328" class="small">питание + программирование</text>
<circle cx="1725" cy="380" r="6" class="node"/><text x="1760" y="374" class="ref">GPIO_CLK</text><text x="1760" y="400" class="small">clock-capable GPIO; назначить по pinout</text><path d="M1780 455H2100" class="power"/><text x="1760" y="446" class="net">+3V3 OUT → питание U1</text><path d="M1780 510H2100" class="wire"/><text x="1760" y="501" class="net">GND → общая земля</text>
<rect x="1780" y="550" width="145" height="80" rx="6" class="external"/><text x="1814" y="580" class="ref">KEY1</text><text x="1796" y="610" class="small">режим CH1</text><rect x="1945" y="550" width="145" height="80" rx="6" class="external"/><text x="1979" y="580" class="ref">KEY2</text><text x="1961" y="610" class="small">режим CH2</text><text x="1780" y="668" class="small">Каждое нажатие: 1 → 10 → 100 → 1 PPS</text><text x="1780" y="707" class="ref">GPIO_PPS1</text><circle cx="2155" cy="700" r="6" class="node"/><text x="1780" y="763" class="ref">GPIO_PPS2</text><circle cx="2155" cy="756" r="6" class="node"/><text x="1780" y="798" class="small">Номера GPIO — после проверки pinout ревизии.</text>
<path d="M1725 455H1690" class="power"/><text x="1665" y="447" class="net" text-anchor="end">+3V3</text><path d="M1725 510H1690" class="wire"/><text x="1665" y="502" class="net" text-anchor="end">GND</text>

<!-- 5 outputs -->
<text x="1725" y="870" class="bt">5. Выходы на осциллограф</text><rect x="1725" y="895" width="430" height="320" rx="8" class="box"/>
<path d="M2155 700H2175V950H1780" class="wire"/><use href="#rh" x="1780" y="950"/><path d="M1880 950H2020" class="wire"/><text x="1808" y="913" class="ref">R7</text><text x="1805" y="990">33 Ω</text><use href="#tp" x="1940" y="915"/><path d="M1940 925V950" class="wire"/><text x="1915" y="892" class="ref">TP4</text><circle cx="2055" cy="950" r="22" class="box"/><circle cx="2055" cy="950" r="5" class="node"/><text x="1985" y="1005" class="ref">J2 — PPS CH1</text><path d="M2020 950H2055M2033 1018h44M2040 1028h30" class="wire"/>
<path d="M2155 756H2190V1085H1780" class="wire"/><use href="#rh" x="1780" y="1085"/><path d="M1880 1085H2020" class="wire"/><text x="1808" y="1048" class="ref">R8</text><text x="1805" y="1125">33 Ω</text><use href="#tp" x="1940" y="1050"/><path d="M1940 1060V1085" class="wire"/><text x="1915" y="1027" class="ref">TP5</text><circle cx="2055" cy="1085" r="22" class="box"/><circle cx="2055" cy="1085" r="5" class="node"/><text x="1985" y="1140" class="ref">J3 — PPS CH2</text><path d="M2020 1085H2055M2033 1153h44M2040 1163h30" class="wire"/><text x="1760" y="1195" class="small">J2/J3: центр — сигнал; экран — GND.</text>

<!-- common ground bus -->
<path d="M375 340V1235H2090" class="wire"/><path d="M585 477V1235M1260 902V1235M1400 542V1235M1450 857V1235M1300 1125V1235M1470 1125V1235M1725 510V1235M2055 1018V1235M2055 1153V1235" class="wire"/><use href="#gnd" x="1090" y="1235"/><text x="1125" y="1260" class="net">GND — общая земля макета и экранов коаксиалов</text>

<!-- bom and notes -->
<rect x="45" y="585" width="1035" height="570" rx="8" class="note"/><text x="75" y="625" class="bt">Перечень элементов прототипа</text><text x="75" y="665" class="bom">U1 — TLV3511DBVR, SOT-23-5; A1 — переходник SOT-23-5 → 2.54 мм</text><text x="75" y="700" class="bom">U2 — отладочная плата Tang Nano 20K (показана как законченное устройство)</text><text x="75" y="735" class="bom">R1 — 49.9 Ω, 1%; R2 — 1 кΩ; R3, R4, R5 — 10 кΩ; R6, R7, R8 — 33 Ω</text><text x="75" y="770" class="bom">C1, C3 — 100 нФ; C2, C4 — 1 мкФ; керамика X7R, напряжение ≥ 6.3 В</text><text x="75" y="805" class="bom">J1 — входной коаксиальный разъём; J2, J3 — выходные коаксиальные разъёмы</text><text x="75" y="840" class="bom">TP1…TP5 — контрольные точки; монтажный провод; двухсторонняя макетная плата</text>
<text x="75" y="900" class="bt">Критичные указания</text><text x="75" y="940">1. Осциллограф: вход 1 MΩ; режим 50 Ω выключен.</text><text x="75" y="978">2. R1 поставить у J1; C3 — непосредственно у выводов питания U1.</text><text x="75" y="1016">3. J1–R1–C1 и U1–Tang соединить коротко, над сплошной землёй.</text><text x="75" y="1054">4. Не подавать синус 10 МГц непосредственно на GPIO FPGA.</text><text x="75" y="1092">5. Проверить: TP2 ≈ 1.65 В → меандр 10 МГц на TP3 → сигналы PPS.</text><text x="75" y="1130" class="small">R1 — нагрузка 50 Ω для генератора. R7/R8 — последовательное демпфирование, не нагрузка 50 Ω.</text>
<text x="45" y="1360" class="subtitle">Важно: +3V3 и GND связаны одноимёнными цепями; номера GPIO назначаются по pinout конкретной ревизии Tang Nano 20K.</text>
</svg>
